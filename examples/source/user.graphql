type User {
  id: ID!
  name: String! @backeneko(value: "Ada Lovelace")
  email: String!
  bio: String @backeneko(empty: true)
  role: Role! @mock(value: "ADMIN")
  posts: [Post!]!
  badges: [String] @mock(empty: true)
  age: Int @backeneko(empty: true)
}

enum Role {
  ADMIN
  EDITOR
  VIEWER
}

input CreateUserInput {
  name: String!
  email: String!
}
